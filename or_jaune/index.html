<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Splat Viewer with FOV</title>

    <style>
        /* Base styles */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #222; /* A neutral html bg */
            width: 100%;
            height: 100%;
            position: fixed;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
            position: relative; /* Ensure canvas is part of the flow for z-index */
            z-index: 1;        /* Sit behind the progress container */
        }
        canvas:active {
            cursor: grabbing;
        }

        /* --- Loader Styles --- */
        #progress-container {
            position: absolute; /* Cover the canvas */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex; /* Use flexbox for centering */
            flex-direction: column; /* Stack loader and text vertically */
            justify-content: center; /* Center vertically */
            align-items: center; /* Center horizontally */
            z-index: 10; /* Sit on top of the canvas */
            background-color: rgba(0, 0, 0, 0.7); /* Optional: Dim background */
            opacity: 1; /* Start visible */
            transition: opacity 0.5s ease-out; /* Fade out transition */
            pointer-events: none; /* Allow clicks through by default */
        }

        #progress-container.hidden { /* State for hiding */
             opacity: 0;
             pointer-events: none; /* Ensure no interaction when hidden */
        }

        .loader {
            border: 6px solid #f3f3f3; /* Light grey base circle */
            border-top: 6px solid #3498db; /* Blue spinning part */
            border-radius: 50%;
            width: 50px; /* Size of the spinner */
            height: 50px;
            animation: spin 1s linear infinite; /* Animation definition */
            margin-bottom: 15px; /* Space between spinner and text */
        }

        /* Spinner Animation */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-text {
            color: #eee;
            font-size: 1.1em;
            text-align: center;
        }

        /* Style for error messages inside the container */
         #progress-container .error-message {
             color: #ff8a8a; /* Light red for errors */
             font-weight: bold;
             text-align: center;
             max-width: 80%;
             margin-bottom: 0.5em; /* Space below error title */
         }
         #progress-container .error-details {
             color: #ccc;
             font-size: 0.9em;
             margin-top: 0.5em;
             text-align: center;
             max-width: 80%;
             word-wrap: break-word; /* Wrap long error messages */
         }

    </style>
</head>

<body>
    <!-- Progress Container -->
    <div id="progress-container">
        <div class="loader"></div>
        <p id="loading-text">Loading scene...</p>
    </div>

    <!-- Canvas for Rendering -->
    <canvas id="canvas"></canvas>

    <script type="module">
        import * as SPLAT from "https://cdn.jsdelivr.net/npm/gsplat@latest";
        console.log("gsplat library loaded:", SPLAT);

        // --- RENDERER CONFIGURATION ---
        const rendererConfig = {
            // Background color for the WebGL canvas (Hex format)
            backgroundColorHex: "#CCCCCC", // Default: Light Grey
            // Background alpha (0.0 = transparent, 1.0 = opaque)
            backgroundAlpha: 1.0
        };
        // --- END OF RENDERER CONFIGURATION ---


        // --- INITIAL CAMERA CONFIGURATION ---
        const initialCameraConfig = {
            position: { x: 1.403, y: -0.709, z: 0.053 }, // Example: Specific view
            target:   { x: 0, y: -0.2, z: 0 },          // Point the camera looks at
            fov: 50 // Vertical Field of View in degrees (adjust as needed, e.g., 45-75)
        };
        // --- END OF INITIAL CAMERA CONFIGURATION ---


        // --- ORBIT CONTROLS CONFIGURATION ---
        const orbitControlsConfig = {
            orbitSpeed: 2.0,    // Rotation speed multiplier
            zoomSpeed: 1.0,     // Zoom speed multiplier
            panSpeed: 1.0,      // Panning speed multiplier
            minZoom: 2,       // Closest zoom distance (relative)
            maxZoom: 10.0,      // Farthest zoom distance (relative)
            minAngle: 5,      // Minimum vertical rotation angle (degrees)
            maxAngle: 90,       // Maximum vertical rotation angle (degrees)
            dampening: 0.12     // Smoothing factor for movement (0=none, ~0.1-0.2=smooth)
        };
        // --- END OF ORBIT CONTROLS CONFIGURATION ---


        // Helper function to convert Hex color to RGBA (0-255 range)
        function hexToRgbaInt(hex, alpha = 1.0) {
            hex = hex.replace('#', '');
            // Pad short hex codes (e.g., #F00 -> #FF0000)
            if (hex.length === 3) {
                hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
            }
            if (hex.length !== 6) {
                console.error("Invalid hex color format:", hex);
                return { r: 0, g: 0, b: 0, a: 255 }; // Return black on error
            }
            try {
                const bigint = parseInt(hex, 16);
                const r = (bigint >> 16) & 255;
                const g = (bigint >> 8) & 255;
                const b = bigint & 255;
                // Convert alpha (0.0-1.0) to 0-255 integer range
                const aInt = Math.max(0, Math.min(255, Math.round(alpha * 255)));
                return { r, g, b, a: aInt };
            } catch (e) {
                 console.error("Error parsing hex color:", hex, e);
                 return { r: 0, g: 0, b: 0, a: 255 }; // Return black on error
            }
        }


        // --- Main Setup and Execution ---
        const canvas = document.getElementById("canvas");
        const progressContainer = document.getElementById("progress-container");
        const loadingText = document.getElementById("loading-text"); // Get the text element for potential updates

        // Basic check for essential elements
        if (!canvas || !progressContainer || !loadingText) {
            console.error("Required HTML elements not found!");
            const body = document.body;
            // Attempt to display error even if some elements are missing
            if(body) {
                 body.innerHTML = '<p style="color:red; text-align:center; padding-top: 50px; font-family: sans-serif;">Initialization failed: Missing required HTML elements (canvas or progress-container).</p>';
             } else {
                alert("Initialization failed: Missing required HTML elements.");
             }
        } else {
            try {
                // 1. Initialize Renderer
                const renderer = new SPLAT.WebGLRenderer(canvas);
                console.log("Renderer created:", renderer);

                // Set Renderer Background Color
                try {
                    const bgColorRgba = hexToRgbaInt(rendererConfig.backgroundColorHex, rendererConfig.backgroundAlpha);
                    if ('backgroundColor' in renderer && SPLAT.Color32) {
                        renderer.backgroundColor = new SPLAT.Color32(bgColorRgba.r, bgColorRgba.g, bgColorRgba.b, bgColorRgba.a);
                        console.log(`Set renderer.backgroundColor = Color32(${bgColorRgba.r}, ${bgColorRgba.g}, ${bgColorRgba.b}, ${bgColorRgba.a})`);
                    } else {
                        console.warn("Renderer 'backgroundColor' property or SPLAT.Color32 not found. Background might not be set.");
                    }
                } catch (e) {
                    console.error("Error setting background color on renderer:", e);
                }

                // 2. Initialize Scene, Camera, and Controls
                const scene = new SPLAT.Scene();
                const camera = new SPLAT.Camera();
                console.log("Camera object created:", camera);

                const controls = new SPLAT.OrbitControls(camera, canvas);
                console.log("OrbitControls object created:", controls);

                // Apply OrbitControls Configuration
                console.log("Applying OrbitControls configuration:");
                for (const key in orbitControlsConfig) {
                     if (key in controls) {
                          try {
                              controls[key] = orbitControlsConfig[key];
                              console.log(`  Set controls.${key} = ${orbitControlsConfig[key]}`);
                          } catch (e) {
                              console.warn(`  Could not set controls.${key}:`, e.message);
                          }
                     } else {
                         console.warn(`  Property '${key}' (from config) not found on gsplat.js OrbitControls.`);
                     }
                }

                // 3. Main Asynchronous Function (Loading and Rendering)
                async function main() {
                    const url = "splat.splat"; // <-- Make sure this file exists relative to your HTML or provide a full URL

                    try {
                        // Load the scene data
                        await SPLAT.Loader.LoadAsync(url, scene, (progress) => {
                           // Optional: Update loading text with percentage
                           // const percent = Math.floor(progress * 100);
                           // loadingText.textContent = `Loading scene... ${percent}%`;
                           console.log(`Loading progress: ${progress}`); // Log progress to console
                        });
                        console.log("Splat file loaded successfully.");
                        loadingText.textContent = "Processing..."; // Optional: Indicate processing after download


                        // --- Configure Initial Camera View ---
                        console.log("Setting initial camera view from config.");

                        // Set Position
                        if (initialCameraConfig.position) {
                            camera.position = new SPLAT.Vector3(initialCameraConfig.position.x, initialCameraConfig.position.y, initialCameraConfig.position.z);
                            console.log("  Set initial camera position:", camera.position);
                        } else {
                             camera.position = new SPLAT.Vector3(0, 1, 5); // Sensible default
                             console.log("  Using default initial camera position.");
                        }

                        // Set Target (via Controls for orientation)
                        if (initialCameraConfig.target) {
                             controls.setCameraTarget(new SPLAT.Vector3(initialCameraConfig.target.x, initialCameraConfig.target.y, initialCameraConfig.target.z));
                             console.log("  Set initial controls target:", initialCameraConfig.target);
                        } else {
                            controls.setCameraTarget(new SPLAT.Vector3(0, 0, 0)); // Default target (origin)
                            console.log("  Using default initial controls target (origin).");
                        }

                        // Set FOV
                        if (initialCameraConfig.fov !== undefined && typeof initialCameraConfig.fov === 'number') {
                            camera.fov = initialCameraConfig.fov; // Set the FOV property
                            console.log(`  Set initial camera FOV: ${camera.fov} degrees`);
                        } else {
                            // Use the camera's default FOV if not specified or invalid
                            console.log(`  Using default camera FOV: ${camera.fov} degrees`);
                        }

                        // Set initial Aspect Ratio (based on current canvas size)
                        camera.aspect = canvas.clientWidth / canvas.clientHeight; // Set the aspect property
                        console.log(`  Set initial camera aspect ratio: ${camera.aspect.toFixed(2)}`);

                        // IMPORTANT: Call controls.update() *after* setting position/target
                        // to correctly orient the camera initially.
                        controls.update();
                        console.log("  Called controls.update() to finalize initial view.");
                        // --- End Initial Camera View Setup ---


                        // --- Hide Progress Container Smoothly ---
                        loadingText.textContent = "Scene Loaded"; // Final confirmation
                        await new Promise(resolve => setTimeout(resolve, 100)); // Brief pause before fade

                        progressContainer.style.opacity = '0'; // Start fade out
                        progressContainer.addEventListener('transitionend', () => {
                            // Check opacity to ensure this runs for the fade-out transition
                            if (progressContainer.style.opacity === '0') {
                                progressContainer.style.display = 'none'; // Hide completely after fade
                            }
                        }, { once: true }); // Only run this listener once
                        canvas.style.pointerEvents = 'auto';    // Enable interaction with canvas
                        progressContainer.style.pointerEvents = 'none'; // Disable interaction with loader overlay


                    } catch (error) {
                        console.error("Error loading or processing splat file:", error);
                        // Display error message in the progress container
                        progressContainer.innerHTML = `
                            <div class="error-message">Error Loading Scene</div>
                            <div class="error-details">${error.message || 'Unknown error'}</div>
                            <div class="error-details" style="color:#aaa; margin-top:1em;">Please check the file path ('${url}') exists and the server is configured correctly. Check console for more details.</div>
                        `;
                       progressContainer.style.opacity = '1'; // Ensure it's visible
                       progressContainer.style.display = 'flex'; // Ensure it's displayed correctly
                       progressContainer.style.pointerEvents = 'auto'; // Make errors potentially selectable
                       return; // Stop execution on error
                    }

                    // --- Resize Handling ---
                    const handleResize = () => {
                        const newWidth = canvas.clientWidth; // Use client dimensions for aspect ratio
                        const newHeight = canvas.clientHeight;

                        // Update renderer draw buffer size (consider devicePixelRatio for sharpness)
                        const dpr = window.devicePixelRatio || 1;
                        renderer.setSize(Math.floor(newWidth * dpr), Math.floor(newHeight * dpr));

                        // Update camera aspect ratio (gsplat handles projection matrix update internally)
                        if (camera) {
                             camera.aspect = newWidth / newHeight;
                             // console.log(`Resized - Updated camera aspect: ${camera.aspect.toFixed(2)}`); // Optional log
                        }
                    };

                    // --- Render Loop ---
                    let rafId = null; // To keep track of the animation frame request
                    const frame = () => {
                        controls.update(); // Update camera position based on user interaction & damping
                        renderer.render(scene, camera); // Render the current frame
                        rafId = requestAnimationFrame(frame); // Schedule the next frame
                    };

                    // --- Initial Setup & Start Rendering ---
                    handleResize(); // Call once initially to set correct size and aspect ratio
                    window.addEventListener("resize", handleResize); // Add listener for window resize

                    // Clean up previous frame requests if any (unlikely here, but good practice)
                    if (rafId) cancelAnimationFrame(rafId);

                    console.log("Starting render loop...");
                    rafId = requestAnimationFrame(frame); // Start the animation loop
                    canvas.style.pointerEvents = 'auto'; // Redundant? Ensure canvas interaction is enabled
                }

                 // --- Execute Main Function ---
                 main().catch(err => {
                     // Catch unhandled promise rejections from main()
                     console.error("Critical error during main execution:", err);
                     progressContainer.innerHTML = `
                         <div class="error-message">Runtime Error</div>
                         <div class="error-details">${err.message || 'Unknown critical error'}</div>
                         <div class="error-details" style="color:#aaa; margin-top:1em;">Check the browser console for details.</div>
                     `;
                     progressContainer.style.opacity = '1';
                     progressContainer.style.display = 'flex';
                     progressContainer.style.pointerEvents = 'auto';
                 });

            } catch (initError) {
                 // Catch errors during initial synchronous setup (Renderer, Camera, Controls creation)
                 console.error("Error during initial setup:", initError);
                 progressContainer.innerHTML = `
                     <div class="error-message">Initialization Error</div>
                     <div class="error-details">${initError.message || 'Failed to initialize viewer components'}</div>
                     <div class="error-details" style="color:#aaa; margin-top:1em;">Check the browser console for details.</div>
                 `;
                 progressContainer.style.opacity = '1';
                 progressContainer.style.display = 'flex';
                 progressContainer.style.pointerEvents = 'auto';
            }
        }
    </script>
</body>
</html>
